<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="vocabulary.css" />
    <link rel="stylesheet" href="vendor/katex/katex.min.css" />
    <title>生词本 · Glint</title>
  </head>
  <body>
    <div class="app">
      <div class="titlebar">
        <span class="logo">生词本</span>
        <span id="summary" class="hint"></span>
        <span class="spacer"></span>
        <button id="close" class="iconbtn" title="关闭 (Esc)" aria-label="关闭生词本">✕</button>
      </div>
      <div class="controls">
        <input id="search" type="search" placeholder="搜索单词或释义" aria-label="搜索生词本" spellcheck="false" />
        <select id="sort" aria-label="排序方式">
          <option value="recent">最近收藏</option>
          <option value="queries">查询次数从高到低</option>
        </select>
      </div>
      <p id="error" role="alert" hidden></p>
      <div class="content">
        <div id="list" aria-label="已收藏词条"></div>
        <section id="detail" aria-label="词条详情">
          <p class="empty">选择一个单词查看释义</p>
        </section>
      </div>
      <div class="footnote">查询次数从收藏后开始统计</div>
    </div>
    <script src="vocabulary.js"></script>
  </body>
</html>
