name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-26
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - run: |
          xcodebuild -version
          swift --version
      - run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Info.plist)
          test "$RELEASE_TAG" = "v$version"
      - name: Import signing identity
        run: bash scripts/signing.sh import
        env:
          GLINT_SIGNING_P12_BASE64: ${{ secrets.GLINT_SIGNING_P12_BASE64 }}
          GLINT_SIGNING_PASSWORD: ${{ secrets.GLINT_SIGNING_PASSWORD }}
      - run: bash scripts/test-signing.sh
      - run: bash scripts/swift.sh test --arch arm64 --disable-xctest
      - run: bash scripts/package.sh
      - run: |
          python3 - <<'PY' > .cache/release-notes.md
          import json
          import plistlib
          version = plistlib.load(open('build/Info.plist', 'rb'))['CFBundleShortVersionString']
          entries = json.load(open('Sources/GlintCore/Resources/changelog.json'))
          entry = next(item for item in entries if item['version'] == version)
          print('\n'.join('- ' + item for item in entry['items']))
          PY
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" "dist/Glint-${version}-arm64.dmg" "dist/Glint-${version}-arm64-mac.zip" dist/SHA256SUMS --verify-tag --draft --title "Glint $RELEASE_TAG" --notes-file .cache/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Clean up signing identity
        if: ${{ always() }}
        run: |
          if [[ -f .signing/Glint.keychain-db ]]; then
            security delete-keychain "$PWD/.signing/Glint.keychain-db"
          fi
          rm -rf .signing
