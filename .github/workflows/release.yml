name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.4"
      - run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Info.plist)
          test "$GITHUB_REF_NAME" = "v$version"
      - run: bash scripts/swift.sh test --disable-xctest
      - run: bash scripts/package.sh
      - run: |
          python3 - <<'PY' > .cache/release-notes.md
          import json
          import plistlib
          version = plistlib.load(open('build/Info.plist', 'rb'))['CFBundleShortVersionString']
          entries = json.load(open('Sources/GlintCore/Resources/changelog.json'))
          entry = next(item for item in entries if item['version'] == version)
          print('\n'.join('- ' + item for item in entry['items']))
          PY
          gh release create "$GITHUB_REF_NAME" dist/Glint-*.dmg dist/Glint-*-mac.zip dist/SHA256SUMS --draft --title "Glint $GITHUB_REF_NAME" --notes-file .cache/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
